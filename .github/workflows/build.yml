name: Build and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            target: win
            os: windows-2022
            arch: x64
            command: npx electron-builder --win nsis portable --x64 --publish never
          - platform: macOS
            target: mac
            os: macos-15
            arch: arm64
            command: npx electron-builder --mac dmg zip --arm64 --publish never
          - platform: macOS
            target: mac
            os: macos-15-intel
            arch: x64
            command: npx electron-builder --mac dmg zip --x64 --publish never
          - platform: Linux
            target: linux
            os: ubuntu-24.04
            arch: x64
            command: npx electron-builder --linux AppImage deb --x64 --publish never
          - platform: Linux
            target: linux
            os: ubuntu-24.04-arm
            arch: arm64
            command: npx electron-builder --linux AppImage deb --arm64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libasound2t64 libgbm1 libgtk-3-0t64 libfuse2t64
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare and verify offline speech
        run: npm run test:speech
      - name: Package native application
        if: startsWith(github.ref, 'refs/tags/')
        run: ${{ matrix.command }}
      - name: Package application for native smoke test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --dir --publish never
      - name: Test packaged speech on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Test packaged speech on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/Rovidx-Teleprompter-*.exe
            release/Rovidx-Teleprompter-*.dmg
            release/Rovidx-Teleprompter-*.zip
            release/Rovidx-Teleprompter-*.AppImage
            release/Rovidx-Teleprompter-*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  release:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify completeness, publish binaries and checksums
        run: node scripts/publish-release.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
